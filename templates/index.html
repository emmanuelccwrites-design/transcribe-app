<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Whisper MVP</title>
</head>
<body>
    <h1>Local Audio Transcription</h1>
    <p>Upload an audio file (.mp3, .m4a, .wav) to transcribe using OpenAI's Whisper model locally.</p>
    
    <form id="uploadForm">
        <input type="file" id="audioInput" name="audio_file" accept="audio/*" required>
        <button type="submit" id="submitBtn">Transcribe</button>
    </form>
    
    <div id="status" style="margin-top: 20px; font-weight: bold; color: blue;"></div>
    
    <h2>Result:</h2>
    <div style="border: 1px solid #ccc; padding: 10px; min-height: 100px; white-space: pre-wrap;" id="resultBox"></div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('audioInput');
            if (fileInput.files.length === 0) {
                alert("Please select a file.");
                return;
            }
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('audio_file', file);
            
            const statusDiv = document.getElementById('status');
            const resultBox = document.getElementById('resultBox');
            const submitBtn = document.getElementById('submitBtn');
            
            statusDiv.textContent = 'Uploading and transcribing... This might take a few minutes depending on the file length and your hardware.';
            resultBox.textContent = '';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    statusDiv.textContent = 'Transcription complete!';
                    statusDiv.style.color = 'green';
                    resultBox.textContent = data.text;
                } else {
                    statusDiv.textContent = 'Error occurred.';
                    statusDiv.style.color = 'red';
                    resultBox.textContent = 'Error: ' + data.error;
                }
            } catch (error) {
                statusDiv.textContent = 'Request failed.';
                statusDiv.style.color = 'red';
                resultBox.textContent = 'Error: ' + error.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
